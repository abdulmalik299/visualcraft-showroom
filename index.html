<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="VisualCraft — premium cinematic artist showroom." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VisualCraft Showroom</title>

    <script>
      // Decode GitHub Pages SPA redirect query back into the real client route.
      (function () {
        var redirect = window.location.search;
        if (!redirect || redirect[1] !== '/') return;

        var decoded = redirect
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');

        window.history.replaceState(null, '', window.location.pathname.replace(/\/$/, '') + decoded + window.location.hash);
      })();
    </script>

    <!-- 3D preview component (GLB/GLTF) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
